# Full-stack run on Postgres (the production database from the design).
# Fake Salesforce runs in-process inside the backend, so there are two services: db + backend.
# The React frontend is run separately with `cd frontend && npm run dev` (it proxies to :8000).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tequity
      POSTGRES_PASSWORD: tequity
      POSTGRES_DB: tequity
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tequity"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://tequity:tequity@db:5432/tequity
      # A low cap so the outbound drain is visibly paced in the UI demo (design states 100).
      SALESFORCE_RATE_CAP: "5"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
